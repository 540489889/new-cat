# Codemagic 配置：Flutter iOS 打包（Release + 手动上传的开发证书 → 产出可安装 ipa）
#
# 前置（在 Codemagic 网页 Team settings → codemagic.yaml settings → Code signing identities 完成）：
#   - iOS certificates 页上传 655dc3cc926a42308f72f0852658333e.p12，密码 zhichuang，任意 Reference name
#   - iOS provisioning profiles 页上传 zhichuangdev.mobileprovision，任意 Reference name
# 说明：本配置用 distribution_type + bundle_identifier 自动匹配已上传的签名文件，
#       因此无需在 yaml 里写死 Reference name（两种写法互斥，不可混用）。
workflows:
  ios-release:
    name: iOS Release IPA
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development # 描述文件为 development 类型（含已注册设备列表）
        bundle_identifier: pet.jolipaw.app
    scripts:
      - name: 应用签名配置到 Xcode 工程
        script: xcode-project use-profiles
      - name: Flutter 依赖
        script: flutter pub get
      - name: CocoaPods
        script: cd ios && pod install && cd ..
      - name: 构建 IPA（Release + 手动签名）
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa # 构建产物 ipa，Codemagic 会提供下载/安装链接
