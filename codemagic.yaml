# Codemagic 配置：Flutter iOS 打包（Release + 手动签名 → 产出可安装 ipa）
# 证书/描述文件请在 Codemagic 网页 “Settings → Code signing → iOS code signing → Manual” 上传：
#   - 证书：655dc3cc926a42308f72f0852658333e.p12（密码 zhichuang）
#   - 描述文件：zhichuangdev.mobileprovision（development 类型，Bundle ID = pet.jolipaw.app）
# 并在 “Environment variables” 设 CERTIFICATE_PASSWORD = zhichuang（勾选 Secure）
workflows:
  ios-release:
    name: iOS Release IPA
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development # 描述文件为 development 类型（含已注册设备列表）
        provisioning_profiles:
          - zhichuangdev.mobileprovision
        certificates:
          - 655dc3cc926a42308f72f0852658333e.p12
    scripts:
      - name: Flutter 依赖
        script: flutter pub get
      - name: CocoaPods
        script: cd ios && pod install && cd ..
      - name: 构建 IPA（Release + 手动签名）
        script: |
          flutter build ipa --release \
            --export-options-plist=$FCI_EXPORT_OPTIONS_FILE
    artifacts:
      - build/ios/ipa/*.ipa # 构建产物 ipa，Codemagic 会提供下载/安装链接
